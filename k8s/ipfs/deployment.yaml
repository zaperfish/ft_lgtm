apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipfs-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipfs-node
  template:
    metadata:
      labels:
        app: ipfs-node
    spec:
      containers:
        - name: ipfs-node
          image: ipfs/kubo:v0.42.0
          imagePullPolicy: IfNotPresent
